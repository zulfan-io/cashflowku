# jaring anti-badai deploy: pin build biar Netlify nggak nebak
[build]
  command = "pnpm build"      # = vite-ssg build (package.json:23)
  publish = "dist"            # output vite-ssg
[build.environment]
  NODE_VERSION = "18"         # vite 2.9 aman di 18; deterministic
# Netlify auto-detect pnpm dari pnpm-lock.yaml, nggak perlu pin PNPM_VERSION
