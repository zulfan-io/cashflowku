# MERGE: config lama (redirects+headers+node16) + benerin 2 bug template (command & publish)
[build]
  command = "pnpm build"        # buang "ci =" garbage; Netlify auto-install dari lockfile
  publish = "dist"              # buang slash depan ("/dist" = not found)
[build.environment]
  NODE_VERSION = "16"           # pertahanin yang dites template, jangan nebak 18
[[redirects]]                   # RESTORE: tanpa ini refresh route dalam = 404
  from = "/*"
  to = "/index.html"
  status = 200
[[headers]]                     # RESTORE: PWA manifest butuh MIME bener
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
